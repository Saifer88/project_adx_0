name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish if version is new
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view project-adx-0@"$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "project-adx-0@$VERSION already published; skipping."
            exit 0
          fi
          # Publish to the default `latest` dist-tag so the documented install
          # command — `npm install -g project-adx-0` — resolves to this version.
          # While the project is pre-1.0 alpha, the newest alpha IS the latest
          # release users should get. (Revisit once a stable line and a separate
          # prerelease line need to coexist.)
          echo "Publishing project-adx-0@$VERSION to latest."
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
