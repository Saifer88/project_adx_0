name: Publish

on:
  push:
    branches: [main]

# Read-only: CI no longer commits a version bump back to main. The version in
# package.json is the source of truth and is set by humans.
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Honor [skip ci] in commit messages if present (e.g. docs-only pushes).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Decide whether to publish package.json's version
        id: version
        run: |
          # The source of truth is package.json: humans choose the version
          # (major/minor/patch) and commit it. CI does not rewrite or
          # auto-increment it. We publish that exact version, and only if it is
          # not already on npm; otherwise we skip cleanly (so re-pushes and the
          # bot's own commit are no-ops rather than errors).
          CURRENT="$(node -p "require('./package.json').version")"
          # All published versions, newline-separated (empty on a brand-new pkg).
          VERSIONS="$(npm view project-adx-0 versions --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v=[];try{v=JSON.parse(s||"[]")}catch{};if(!Array.isArray(v))v=[v];process.stdout.write(v.join("\n"))})' \
            || true)"
          if printf '%s\n' "$VERSIONS" | grep -Fxq "$CURRENT"; then
            echo "project-adx-0@$CURRENT is already published; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "project-adx-0@$CURRENT is not yet published; will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (latest)
        if: steps.version.outputs.should_publish == 'true'
        run: |
          # Publishes package.json's version under the default `latest`
          # dist-tag so the documented install — `npm install -g project-adx-0`
          # — gets this build. prepublishOnly rebuilds from the committed source.
          echo "Publishing project-adx-0@${{ steps.version.outputs.current }} to latest."
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
