name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish if version is new
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view project-adx-0@"$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "project-adx-0@$VERSION already published; skipping."
            exit 0
          fi
          # Prerelease versions (e.g. 0.1.0-alpha) publish under their prerelease
          # dist-tag so `latest` stays reserved for stable releases. A plain
          # x.y.z version publishes as `latest`.
          case "$VERSION" in
            *-*) TAG="${VERSION#*-}"; TAG="${TAG%%.*}" ;;
            *)   TAG="latest" ;;
          esac
          echo "Publishing project-adx-0@$VERSION under dist-tag '$TAG'."
          npm publish --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
