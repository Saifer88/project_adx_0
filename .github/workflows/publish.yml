name: Publish

on:
  push:
    branches: [main]

# CI auto-increments the PATCH digit (x.y.+1) on every push to main, commits the
# bump back to main with [skip ci] (so the bump commit does not re-trigger this
# workflow), and publishes that version. Humans bump MAJOR/MINOR by editing
# package.json directly; CI continues patching from whatever is committed.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the bump commit's own push and any push that opts out with [skip ci].
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + a token with write access so we can commit the bump.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Bump patch version and commit to main
        id: version
        run: |
          # Auto-increment the PATCH digit from package.json's current version.
          # `npm version patch` updates package.json (+package-lock.json) and is
          # the source of the new number; --no-git-tag-version keeps npm from
          # creating its own commit/tag so we control the commit message.
          NEW="$(npm version patch --no-git-tag-version)"
          # `npm version` prints the new version prefixed with "v" (e.g. v0.2.1).
          NEW="${NEW#v}"
          echo "Bumped to project-adx-0@$NEW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          # [skip ci] prevents this push from re-triggering the workflow (loop guard).
          git commit -m "chore: release v$NEW [skip ci]"
          git push origin HEAD:main
          echo "current=$NEW" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (latest)
        run: |
          # Publishes the freshly bumped version under the default `latest`
          # dist-tag so the documented install — `npm install -g project-adx-0`
          # — gets this build. prepublishOnly rebuilds from the committed source.
          echo "Publishing project-adx-0@${{ steps.version.outputs.current }} to latest."
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
